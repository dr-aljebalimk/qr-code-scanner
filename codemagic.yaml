workflows:
  android-release:
    name: Android APK Build
    max_build_duration: 30
    environment:
      flutter: 3.32.0
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          cd qr_scanner_app
          flutter pub get
      - name: Build APK
        script: |
          cd qr_scanner_app
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - qr_scanner_app/build/app/outputs/flutter-apk/app-release.apk
